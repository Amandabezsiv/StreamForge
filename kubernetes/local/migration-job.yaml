apiVersion: batch/v1
kind: Job
metadata:
  name: streamforge-migrate
  namespace: streamforge
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 300
  template:
    metadata:
      labels:
        app.kubernetes.io/name: migration
        app.kubernetes.io/part-of: streamforge
    spec:
      restartPolicy: OnFailure
      containers:
        - name: migrate
          image: streamforge:local
          imagePullPolicy: IfNotPresent
          command:
            - alembic
            - upgrade
            - head
          envFrom:
            - secretRef:
                name: streamforge-secrets
