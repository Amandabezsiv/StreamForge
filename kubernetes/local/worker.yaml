apiVersion: v1
kind: Service
metadata:
  name: streamforge-worker
  namespace: streamforge
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: worker
    app.kubernetes.io/part-of: streamforge
  ports:
    - name: metrics
      port: 9000
      targetPort: metrics
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: streamforge-worker
  namespace: streamforge
spec:
  replicas: 4
  selector:
    matchLabels:
      app.kubernetes.io/name: worker
      app.kubernetes.io/part-of: streamforge
  template:
    metadata:
      labels:
        app.kubernetes.io/name: worker
        app.kubernetes.io/part-of: streamforge
    spec:
      terminationGracePeriodSeconds: 40
      containers:
        - name: worker
          image: streamforge:local
          imagePullPolicy: IfNotPresent
          command:
            - streamforge-worker
            - --poll-interval
            - "30"
          envFrom:
            - configMapRef:
                name: streamforge-config
            - secretRef:
                name: streamforge-secrets
          ports:
            - name: metrics
              containerPort: 9000
          readinessProbe:
            tcpSocket:
              port: metrics
            initialDelaySeconds: 2
            periodSeconds: 3
          livenessProbe:
            tcpSocket:
              port: metrics
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "2"
              memory: 1Gi
          volumeMounts:
            - name: media
              mountPath: /app/storage
      volumes:
        - name: media
          persistentVolumeClaim:
            claimName: streamforge-media
