apiVersion: v1
kind: Service
metadata:
  name: streamforge-api
  namespace: streamforge
spec:
  selector:
    app.kubernetes.io/name: api
    app.kubernetes.io/part-of: streamforge
  ports:
    - name: http
      port: 8000
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: streamforge-api
  namespace: streamforge
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: api
      app.kubernetes.io/part-of: streamforge
  template:
    metadata:
      labels:
        app.kubernetes.io/name: api
        app.kubernetes.io/part-of: streamforge
    spec:
      containers:
        - name: api
          image: streamforge:local
          imagePullPolicy: IfNotPresent
          command:
            - streamforge
          envFrom:
            - configMapRef:
                name: streamforge-config
            - secretRef:
                name: streamforge-secrets
          ports:
            - name: http
              containerPort: 8000
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 2
            periodSeconds: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: media
              mountPath: /app/storage
      volumes:
        - name: media
          persistentVolumeClaim:
            claimName: streamforge-media
