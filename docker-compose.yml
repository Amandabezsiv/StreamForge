services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: streamforge
      POSTGRES_USER: streamforge
      POSTGRES_PASSWORD: streamforge
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U streamforge -d streamforge"]
      interval: 5s
      timeout: 5s
      retries: 5

  worker:
    build: .
    command: streamforge-worker
    environment:
      DATABASE_URL: postgresql+psycopg://streamforge:streamforge@postgres:5432/streamforge
      STORAGE_PATH: /app/storage
    volumes:
      - ./storage:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  api:
    build: .
    command: sh -c "alembic upgrade head && streamforge"
    environment:
      DATABASE_URL: postgresql+psycopg://streamforge:streamforge@postgres:5432/streamforge
      STORAGE_PATH: /app/storage
    ports:
      - "8000:8000"
    volumes:
      - ./storage:/app/storage
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
