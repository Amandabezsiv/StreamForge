services:
  postgres:
    image: postgres:17-alpine
    command: postgres -c shared_preload_libraries=pg_stat_statements
    environment:
      POSTGRES_DB: streamforge
      POSTGRES_USER: streamforge
      POSTGRES_PASSWORD: streamforge
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U streamforge -d streamforge"]
      interval: 5s
      timeout: 5s
      retries: 5

  worker:
    build: .
    cpus: "${WORKER_CPU_LIMIT:-0}"
    command: streamforge-worker --poll-interval ${WORKER_POLL_INTERVAL:-30}
    environment:
      DATABASE_URL: postgresql+psycopg://streamforge:streamforge@postgres:5432/streamforge
      STORAGE_PATH: /app/storage
      FFMPEG_THREADS: ${FFMPEG_THREADS:-0}
      JOB_LEASE_SECONDS: ${JOB_LEASE_SECONDS:-30}
      JOB_LEASE_RENEWAL_SECONDS: ${JOB_LEASE_RENEWAL_SECONDS:-10}
      JOB_NOTIFICATIONS_ENABLED: ${JOB_NOTIFICATIONS_ENABLED:-true}
      WORKER_METRICS_PORT: ${WORKER_METRICS_PORT:-9000}
      DIAGNOSTIC_PUBLISH_COMMIT_DELAY_SECONDS: ${DIAGNOSTIC_PUBLISH_COMMIT_DELAY_SECONDS:-0}
    volumes:
      - ./storage:/app/storage
    expose:
      - "9000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  api:
    build: .
    command: sh -c "alembic upgrade head && streamforge"
    environment:
      DATABASE_URL: postgresql+psycopg://streamforge:streamforge@postgres:5432/streamforge
      STORAGE_PATH: /app/storage
    ports:
      - "8000:8000"
    volumes:
      - ./storage:/app/storage
    depends_on:
      postgres:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v3.14.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      - api
      - worker

  grafana:
    image: grafana/grafana:13.2.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    ports:
      - "3000:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  postgres_data:
  prometheus_data:
  grafana_data:
