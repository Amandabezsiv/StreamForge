global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: streamforge-api
    static_configs:
      - targets:
          - api:8000

  - job_name: streamforge-worker
    dns_sd_configs:
      - names:
          - worker
        type: A
        port: 9000
        refresh_interval: 5s
